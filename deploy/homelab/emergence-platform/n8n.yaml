apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: emergence-platform
  labels:
    app: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
        - name: n8n
          image: n8nio/n8n:2.23.3
          ports:
            - containerPort: 5678
              name: http
          env:
            - name: N8N_HOST
              value: n8n.emergence-platform.cloudapplication.lan
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: https
            - name: N8N_EDITOR_BASE_URL
              value: https://n8n.emergence-platform.cloudapplication.lan
            - name: WEBHOOK_URL
              value: https://n8n.emergence-platform.cloudapplication.lan/
            - name: N8N_SECURE_COOKIE
              value: "false"
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: N8N_ENCRYPTION_KEY
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "false"
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: postgres.emergence-platform.svc.cluster.local
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: n8n
            - name: DB_POSTGRESDB_USER
              value: osb
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_PASSWORD
            - name: OSB_N8N_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: OSB_N8N_CLIENT_TOKEN
            - name: OSB_N8N_BRIDGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: OSB_N8N_BRIDGE_SECRET
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_VERSION_NOTIFICATIONS_ENABLED
              value: "false"
            - name: N8N_PERSONALIZATION_ENABLED
              value: "false"
            - name: N8N_ONBOARDING_FLOW_DISABLED
              value: "true"
            # OIDC embed bridge (OSB Admin iframe) — see osb-devservices/n8n/hooks.js
            - name: EXTERNAL_HOOK_FILES
              value: /home/node/hooks.js
            - name: N8N_ADDITIONAL_NON_UI_ROUTES
              value: auth
            - name: OIDC_ISSUER_URL
              value: http://keycloak.keycloak.svc.cluster.local:8080/realms/osb-api
            - name: OIDC_BROWSER_ORIGIN
              value: https://keycloak.cloudapplication.lan
            - name: OIDC_CLIENT_ID
              value: osb-n8n
            - name: OIDC_CLIENT_SECRET
              value: osb-n8n-dev-secret
            - name: OIDC_REDIRECT_URI
              value: https://n8n.emergence-platform.cloudapplication.lan/auth/oidc/callback
            - name: OIDC_SCOPES
              value: openid email profile
            # Allow iframe embed from OSB Admin UI (overrides default X-Frame-Options: sameorigin)
            - name: N8N_CONTENT_SECURITY_POLICY
              value: >-
                {"defaultSrc":["'self'","https:","data:","blob:","'unsafe-inline'","'unsafe-eval'"],"scriptSrc":["'self'","'unsafe-inline'","'unsafe-eval'","https://cdn-rs.n8n.io"],"styleSrc":["'self'","'unsafe-inline'","https:"],"imgSrc":["'self'","data:","https:","blob:"],"fontSrc":["'self'","data:","https:"],"connectSrc":["'self'","https:","wss:","ws:","http:","ws:"],"workerSrc":["'self'","blob:"],"frameAncestors":["'self'","https://emergence-platform.cloudapplication.lan"],"frameSrc":["'self'","https://keycloak.cloudapplication.lan"]}
          volumeMounts:
            - name: hooks
              mountPath: /home/node/hooks.js
              subPath: hooks.js
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: hooks
          configMap:
            name: n8n-hooks
            items:
              - key: hooks.js
                path: hooks.js
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: emergence-platform
spec:
  selector:
    app: n8n
  ports:
    - name: http
      port: 5678
      targetPort: 5678
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  namespace: emergence-platform
spec:
  ingressClassName: traefik
  rules:
    - host: n8n.emergence-platform.cloudapplication.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
  tls:
    - hosts:
        - n8n.emergence-platform.cloudapplication.lan
