{{- if and .Values.openbao.enabled (not .Values.openbao.devMode) (not .Values.openbao.existingSecret) }}
{{- $name := include "osb.openbao.keysSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "osb.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
  annotations:
    # Init Job fills UNSEAL_KEY + OSB_OPENBAO_TOKEN after first operator init.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  OSB_OPENBAO_TOKEN: pending
  UNSEAL_KEY: pending
{{- end }}
{{- end }}
