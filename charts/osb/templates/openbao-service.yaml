{{- if .Values.openbao.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "osb.openbao.fullname" . }}
  labels:
    {{- include "osb.labels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
spec:
  type: {{ .Values.openbao.service.type }}
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: {{ .Values.openbao.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "osb.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: openbao
{{- end }}
